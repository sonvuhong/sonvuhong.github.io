<script src="https://sdk-stg.form.run/js/v2/formrun.js"></script>

<!-- class, action, methodを変更しないでください -->
<form class="formrun" action="https://stg.form.run/api/v1/r/rtebj59yyxgmxt2veaw1ff26" method="post">
  <!-- ↓自由に要素を追加・編集することができます -->
  <div>
    <label>お名前</label>
    <input name="お名前" type="text">
  </div>

  <div>
    <label>郵便番号</label>
    <input
      name="郵便番号"
      type="text"
      data-formrun-type="postal-code-jp"
      placeholder="例：1000001 / 100-0001"
    >
  </div>

  <div>
    <label>都道府県</label>
    <input
      name="都道府県"
      type="text"
      data-formrun-type="region"
    >
  </div>

  <div>
    <label>市区町村</label>
    <input
      name="市区町村"
      type="text"
      data-formrun-type="locality"
    >
  </div>

  <div>
    <label>町名</label>
    <input
      name="町名"
      type="text"
      data-formrun-type="street-address"
    >
  </div>

  <button type="submit" data-formrun-error-text="未入力の項目があります" data-formrun-submitting-text="送信中...">送信</button>
</form>
